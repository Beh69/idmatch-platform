# GitHub Actions CI for the IDMatch platform (the repo lives on GitHub).
# Equivalent to the GitLab pipeline: build + typecheck, then run the test suite
# as the quality gate on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Run automated tests (quality gate)
        run: npm test
